services:
  - type: web
    name: cs2-skin-trade-webapp
    env: python
    region: frankfurt  # или oregon, singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "export PYTHONPATH=src && python -m src.web_app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_PATH
        value: data/bot.db
      # Эти переменные нужно добавить в Dashboard render.com после создания сервиса:
      # - key: BOT_TOKEN
      #   sync: false
      # - key: ADMIN_IDS
      #   sync: false
      # - key: STEAM_API_KEY
      #   sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1